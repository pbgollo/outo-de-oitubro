<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B48250" />
    <meta name="theme-color" content="#B48250" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#B48250" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Uma carta especial para Mari" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <title>Para Mari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__glow sky__glow--a"></div>
      <div class="sky__glow sky__glow--b"></div>
      <div class="sky__grain"></div>
    </div>

    <main class="app">
      <section id="intro" class="screen screen--intro is-active" aria-label="Abertura">
        <div class="cover">
          <p class="cover__mark">Com carinho, para</p>
          <h1 id="hero-name" class="hero-name">Mari</h1>
          <div class="cover__ornament" aria-hidden="true">
            <svg class="cover__heart" viewBox="0 0 32 28" focusable="false">
              <path
                d="M16 25.2C16 25.2 3.5 17.1 3.5 9.6 3.5 5.9 6.4 3.2 10 3.2c2.1 0 4 .9 5.2 2.4C16.5 4.1 18.4 3.2 20.5 3.2c3.6 0 6.5 2.7 6.5 6.4 0 7.5-12.5 15.6-11 15.6z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <p id="hero-title" class="hero-title">Feliz aniversário</p>
          <button id="open-btn" class="cover__open" type="button">Abrir carta</button>
        </div>
      </section>

      <section id="letter" class="screen screen--letter" aria-label="Carta" hidden>
        <div class="letter-stage">
          <div id="letter-page" class="letter-page">
            <div id="letter-sheet" class="letter-sheet is-paper">
              <article id="letter-content" class="letter-content" aria-live="polite"></article>
              <button id="continue-btn" class="page-arrow" type="button" aria-label="Próxima página">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="M9 5l7 7-7 7"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
